media:
  input: images
  output: /My-Portfolio/images
  categories:
  - image
content:
- name: works
  label: Works
  type: collection
  path: _data/works
  format: json
  filename:
    template: '{fields.id}.json'
    field: create
  subfolders: false
  view:
    fields:
    - title
    - category
    - year
    - published
    - order
    primary: title
    sort:
    - title
    - category
    - year
    - published
    - order
    search:
    - title
    - category
    - year
    - description
    - id
    default:
      sort: order
      order: asc
  fields:
  - name: id
    label: 작품 ID
    type: string
    required: true
    pattern: ^[a-z0-9][a-z0-9-]*$
    description: '고유한 영문 소문자·숫자·하이픈 ID. 생성 후 유지하세요. 예: visual-07'
  - name: title
    label: 작품명
    type: string
    required: true
  - name: workGroup
    label: WORKS 탭
    type: select
    required: true
    options:
      values:
      - name: visual
        label: Visual
      - name: web
        label: Web
      - name: branding
        label: Branding
      - name: motion
        label: Video
  - name: category
    label: 카테고리
    type: select
    required: true
    options:
      values:
      - Poster
      - Card news
      - leaflet
      - Business card
      - Banner
      - Web Design
      - Branding
      - Video
      - Motion
  - name: year
    label: 제작 연도
    type: string
    description: 원본에는 연도 정보가 없어 빈 값으로 보존했습니다.
  - name: image
    label: 대표 이미지
    type: image
    required: true
  - name: description
    label: 카드 설명
    type: text
  - name: detailDescription
    label: 상세 설명
    type: text
  - name: tags
    label: 태그
    type: string
    list: true
  - name: projectUrl
    label: 상세페이지 주소
    type: string
    description: 비워 두면 기존 상세 모달 사용. 외부 https:// 주소 또는 ./details/example.html 형태로 입력하세요.
      이미지·영상 주소를 상세페이지로 자동 생성하지 않습니다.
  - name: published
    label: 공개 여부
    type: boolean
    default: true
  - name: featured
    label: 메인 WORKS 노출
    type: boolean
    default: true
    description: 공개 여부와 메인 노출이 모두 켜진 작품만 WORKS에 표시됩니다.
  - name: order
    label: 노출 순서
    type: number
    required: true
    default: 100
    options:
      min: 0
    description: 작은 숫자가 먼저 표시됩니다. 같은 숫자는 작품 ID 순으로 표시됩니다.
  - name: layout
    label: 카드 비율
    type: select
    default: wide
    options:
      values:
      - portrait
      - wide
  - name: detailImages
    label: 상세 이미지
    type: image
    options:
      multiple: true
  - name: format
    label: 규격 · 매체
    type: string
  - name: role
    label: 역할 · 기여도
    type: string
  - name: tools
    label: 사용 프로그램
    type: string
  - name: scope
    label: 브랜딩 작업 범위
    type: string
  - name: duration
    label: 영상 길이
    type: string
  - name: slug
    label: 기존 브랜딩 식별자
    type: string
  - name: youtubeId
    label: YouTube 영상 ID
    type: string
  - name: videoSrc
    label: 영상 파일 경로
    type: string
  - name: designIntent
    label: 디자인 의도
    type: text
  - name: designApproach
    label: 표현 방식 · 제작 과정
    type: text
  - name: brandConcept
    label: 브랜드 콘셉트
    type: text
  - name: identityNotes
    label: 아이덴티티 전개
    type: text
  - name: productionNotes
    label: 영상 기획 의도 · 제작 과정
    type: text
